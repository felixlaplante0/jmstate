name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-latest
            cibw_build: "cp3*-*"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            cibw_build: "cp3*-*"
          # PyTorch has no macOS x86-64 wheel beyond 2.2.2 (Python 3.11 only)
          - name: macOS x86-64
            runner: macos-15-intel
            cibw_build: "cp311-*"
          - name: macOS ARM64
            runner: macos-14
            cibw_build: "cp3*-*"
          - name: Windows x86-64
            runner: windows-latest
            cibw_build: "cp3*-*"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: native
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: "python -m pytest tests"
          CIBW_BEFORE_TEST_LINUX: >-
            pip install --force-reinstall --no-deps torch
            --index-url https://download.pytorch.org/whl/cpu
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install 3.13
      - name: Build sdist
        run: uv build --sdist --python 3.13
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
